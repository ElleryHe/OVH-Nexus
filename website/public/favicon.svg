<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- OVHcloud Royal Blue to Deep Navy Squircle Gradient -->
    <linearGradient id="nexus-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B65FF" />
      <stop offset="50%" stop-color="#0050D7" />
      <stop offset="100%" stop-color="#00297A" />
    </linearGradient>

    <!-- Subtle Top-Left Specular Glow -->
    <radialGradient id="nexus-glow" cx="20" cy="14" r="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0050D7" stop-opacity="0" />
    </radialGradient>

    <!-- Diagonal Nexus Bridge Gradient -->
    <linearGradient id="nexus-bridge" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#nexus-bg)" />
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#nexus-glow)" />
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" />

  <!-- Outer Isometric Hexagonal Cloud Topology -->
  <polygon
    points="32,10 51,21 51,43 32,54 13,43 13,21"
    stroke="#93C5FD"
    stroke-opacity="0.28"
    stroke-width="1.75"
    stroke-linejoin="round"
  />

  <!-- Horizontal Server Rack Bus Lines (3-Tier Baremetal Chassis) -->
  <line x1="21" y1="22" x2="43" y2="22" stroke="#60A5FA" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round" />
  <line x1="21" y1="32" x2="43" y2="32" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" />
  <line x1="21" y1="42" x2="43" y2="42" stroke="#60A5FA" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round" />

  <!-- Core Nexus "N" + Dual Server Pillar Architecture -->
  <path
    d="M21 43V21L43 43V21"
    stroke="url(#nexus-bridge)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Top & Bottom Apex Uplink Nodes -->
  <line x1="32" y1="10" x2="21" y2="21" stroke="#93C5FD" stroke-opacity="0.55" stroke-width="1.75" stroke-linecap="round" />
  <line x1="32" y1="54" x2="43" y2="43" stroke="#93C5FD" stroke-opacity="0.55" stroke-width="1.75" stroke-linecap="round" />
  <circle cx="32" cy="10" r="2.5" fill="#DBEAFE" />
  <circle cx="32" cy="54" r="2.5" fill="#DBEAFE" />

  <!-- Primary Nexus Corner Nodes -->
  <circle cx="21" cy="21" r="3.5" fill="#FFFFFF" />
  <circle cx="21" cy="43" r="3.5" fill="#FFFFFF" />
  <circle cx="43" cy="43" r="3.5" fill="#FFFFFF" />

  <!-- Active Radar / Availability Pulse Node (Top-Right) -->
  <circle cx="43" cy="21" r="6" fill="#38BDF8" fill-opacity="0.3" />
  <circle cx="43" cy="21" r="3.75" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5" />
</svg>
