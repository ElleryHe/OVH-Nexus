<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="OVH Nexus v1.3.0 Go Single Static Binary Architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0050D7"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="16" fill="#f8fafc"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#0f172a">
    OVH Nexus v1.3.0 — Go Single Static Binary Architecture
  </text>

  <!-- Clients Row -->
  <rect x="110" y="68" width="440" height="68" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="97" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">
    Admin Browser (React SPA)
  </text>
  <text x="330" y="121" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#334155">
    HTTP/HTTPS (:20000 &#8594; :8080) &#183; SSE Live Logs
  </text>

  <rect x="650" y="68" width="440" height="68" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="870" y="97" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">
    MCP AI Client (Claude / Cursor / Antigravity)
  </text>
  <text x="870" y="121" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#334155">
    POST /api/mcp (Bearer Token &#183; JSON-RPC 2.0)
  </text>

  <line x1="330" y1="136" x2="330" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="870" y1="136" x2="870" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Docker Container Outer Box -->
  <rect x="60" y="174" width="1080" height="394" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="84" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">
    Docker Container (elleryhe/ovh-nexus) &#183; Alpine 3.24 &#183; Non-Root UID 65532 &#183; ~20 MB Image
  </text>

  <!-- Single Binary Inner Box -->
  <rect x="86" y="216" width="1028" height="334" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="108" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">
    Go 1.27 Single Static Binary (/usr/local/bin/ovh-nexus, CGO_ENABLED=0)
  </text>

  <!-- HTTP & Security Edge Layer -->
  <rect x="108" y="256" width="984" height="74" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="600" y="282" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">
    Hardened net/http + chi Server (:8080) &#183; //go:embed dist (SPA + Gzip + CSP)
  </text>
  <text x="600" y="308" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#334155">
    Native Slowloris Timeouts &amp; 2 MB Body Cap &#183; HttpOnly Session + Trusted-Proxy Rate Limit &#183; RFC 6238 TOTP (strict / sudo)
  </text>

  <!-- Domain Modules Row -->
  <rect x="108" y="344" width="316" height="96" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="266" y="370" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">
    REST API &amp; Multi-Account
  </text>
  <text x="266" y="394" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#334155">
    go-ovh Pool (eu / ca / us)
  </text>
  <text x="266" y="416" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#334155">
    Dedicated, VPS, Orders &amp; Catalog
  </text>

  <rect x="442" y="344" width="316" height="96" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="600" y="370" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">
    Goroutine Workers &amp; Notify
  </text>
  <text x="600" y="394" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#334155">
    Stock, VPS, SKU &amp; Queue Engines
  </text>
  <text x="600" y="416" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#334155">
    Outbound Telegram &amp; SMTP (en/fr/zh)
  </text>

  <rect x="776" y="344" width="316" height="96" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="934" y="370" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">
    MCP Gateway &amp; Observability
  </text>
  <text x="934" y="394" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#334155">
    20 Tools + Bidirectional Privacy Shield
  </text>
  <text x="934" y="416" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#334155">
    English log/slog + SSE Stream Hub
  </text>

  <!-- Vault & SQLite Row -->
  <rect x="108" y="454" width="482" height="78" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="349" y="482" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1e1b4b">
    Crypto Vault (HKDF-SHA256 + AES-256-GCM)
  </text>
  <text x="349" y="508" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#312e81">
    enc:v1:... Column Encryption &#183; SHA-256 Token Hashes
  </text>

  <rect x="610" y="454" width="482" height="78" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="851" y="482" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#14532d">
    Pure-Go SQLite WAL (/data/nexus.db, 0600)
  </text>
  <text x="851" y="508" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#166534">
    ACID Persistence &#183; 10,000-Row System Log Ring Buffer
  </text>

  <!-- Bottom External Connections -->
  <line x1="225" y1="568" x2="225" y2="610" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="568" x2="600" y2="610" stroke="#0050D7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="975" y1="568" x2="975" y2="610" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="614" width="330" height="76" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="225" y="644" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">
    Single Host Volume
  </text>
  <text x="225" y="668" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#334155">
    ./data:/data (UID 65532)
  </text>

  <rect x="435" y="614" width="330" height="76" rx="10" fill="#dbeafe" stroke="#0050D7" stroke-width="1.5"/>
  <text x="600" y="644" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">
    OVHcloud Official APIs
  </text>
  <text x="600" y="668" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#334155">
    ovh-eu &#183; ovh-ca &#183; ovh-us
  </text>

  <rect x="810" y="614" width="330" height="76" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="975" y="644" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">
    Outbound Notifications
  </text>
  <text x="975" y="668" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#334155">
    Telegram Bot API &amp; SMTP Relay
  </text>
</svg>
