<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="OVH Nexus v1.3.0 Go 单静态二进制系统架构图">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0050D7"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="16" fill="#f8fafc"/>

  <!-- 标题 -->
  <text x="600" y="42" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0f172a">
    OVH Nexus v1.3.0 — Go 单静态二进制系统架构图
  </text>

  <!-- 客户端 -->
  <rect x="110" y="68" width="440" height="68" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="97" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a">
    Web 浏览器客户端 (React SPA)
  </text>
  <text x="330" y="121" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">
    HTTP/HTTPS (:20000 &#8594; :8080) &#183; SSE 实时日志流
  </text>

  <rect x="650" y="68" width="440" height="68" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="870" y="97" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a">
    MCP AI 客户端 (Claude / Cursor / Antigravity)
  </text>
  <text x="870" y="121" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">
    POST /api/mcp (Bearer 令牌 &#183; JSON-RPC 2.0)
  </text>

  <line x1="330" y1="136" x2="330" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="870" y1="136" x2="870" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Docker 容器 -->
  <rect x="60" y="174" width="1080" height="394" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="84" y="202" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#0f172a">
    Docker 容器 (elleryhe/ovh-nexus) &#183; Alpine 3.24 &#183; 非 Root UID 65532 &#183; 约 20 MB 镜像
  </text>

  <!-- Go 单二进制 -->
  <rect x="86" y="216" width="1028" height="334" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="108" y="242" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">
    Go 1.27 单静态二进制可执行文件 (/usr/local/bin/ovh-nexus, CGO_ENABLED=0)
  </text>

  <!-- HTTP 与安全网关层 -->
  <rect x="108" y="256" width="984" height="74" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="600" y="282" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#0f172a">
    加固型 net/http + chi 服务 (:8080) &#183; //go:embed dist (SPA 静态资源 + Gzip + CSP)
  </text>
  <text x="600" y="308" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">
    原生 Slowloris 超时防护与 2MB 请求体限制 &#183; HttpOnly 会话 Cookie + 可信代理限流 &#183; RFC 6238 TOTP 分级门禁
  </text>

  <!-- 业务模块行 -->
  <rect x="108" y="344" width="316" height="96" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="266" y="370" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#0f172a">
    REST 控制面与多账户池
  </text>
  <text x="266" y="394" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#334155">
    go-ovh 客户端池 (eu / ca / us)
  </text>
  <text x="266" y="416" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#334155">
    独服、VPS、订单交付与目录定价
  </text>

  <rect x="442" y="344" width="316" height="96" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="600" y="370" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#0f172a">
    Goroutine 后台引擎与推送
  </text>
  <text x="600" y="394" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#334155">
    库存、VPS、SKU 监控与自动下单队列
  </text>
  <text x="600" y="416" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#334155">
    纯出站 Telegram 与 SMTP (en/fr/zh)
  </text>

  <rect x="776" y="344" width="316" height="96" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="934" y="370" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#0f172a">
    MCP 网关与可观测性中心
  </text>
  <text x="934" y="394" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#334155">
    20 个工具 + 双向隐私混淆护盾
  </text>
  <text x="934" y="416" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#334155">
    全英文 log/slog 结构化日志 + SSE 推流
  </text>

  <!-- 加密金库与 SQLite -->
  <rect x="108" y="454" width="482" height="78" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="349" y="482" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#1e1b4b">
    加密金库 (HKDF-SHA256 + AES-256-GCM)
  </text>
  <text x="349" y="508" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#312e81">
    字段级 enc:v1:... 密文 &#183; SHA-256 不可逆令牌哈希
  </text>

  <rect x="610" y="454" width="482" height="78" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="851" y="482" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#14532d">
    纯 Go SQLite WAL 数据库 (/data/nexus.db, 0600)
  </text>
  <text x="851" y="508" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#166534">
    ACID 单文件持久化 &#183; 10,000 条滚动日志环形缓冲
  </text>

  <!-- 外部连接 -->
  <line x1="225" y1="568" x2="225" y2="610" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="568" x2="600" y2="610" stroke="#0050D7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="975" y1="568" x2="975" y2="610" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="614" width="330" height="76" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="225" y="644" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#0f172a">
    宿主机单挂载卷
  </text>
  <text x="225" y="668" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">
    ./data:/data (UID 65532)
  </text>

  <rect x="435" y="614" width="330" height="76" rx="10" fill="#dbeafe" stroke="#0050D7" stroke-width="1.5"/>
  <text x="600" y="644" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#0f172a">
    OVHcloud 官方 API
  </text>
  <text x="600" y="668" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">
    ovh-eu &#183; ovh-ca &#183; ovh-us
  </text>

  <rect x="810" y="614" width="330" height="76" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="975" y="644" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#0f172a">
    纯出站消息推送
  </text>
  <text x="975" y="668" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">
    Telegram Bot API &amp; SMTP 邮件
  </text>
</svg>
