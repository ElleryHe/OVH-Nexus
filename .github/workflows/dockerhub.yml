name: release-and-dockerhub

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Semantic Version
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER=$(node -p "require('./package.json').version")
          fi
          MAJOR_MINOR=$(echo "$VER" | cut -d. -f1,2)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta_single
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ovh-nexus
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=${{ steps.vars.outputs.major_minor }}
            type=raw,value=latest

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_single.outputs.tags }}
          labels: ${{ steps.meta_single.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Git Tag and Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          VERSION: ${{ steps.vars.outputs.version }}
          MAJOR_MINOR: ${{ steps.vars.outputs.major_minor }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping release creation."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f "$TAG" "${GITHUB_SHA}"
            git push origin "$TAG" --force
            NOTES_FILE=$(mktemp)
            cat <<EOF > "$NOTES_FILE"
          ### 🐳 Docker Hub Images

          \`\`\`bash
          docker pull ${DOCKER_USER:-elleryhe}/ovh-nexus:${VERSION}
          docker pull ${DOCKER_USER:-elleryhe}/ovh-nexus:${MAJOR_MINOR}
          docker pull ${DOCKER_USER:-elleryhe}/ovh-nexus:latest
          \`\`\`
          EOF
            gh release create "$TAG" \
              --target "${GITHUB_SHA}" \
              --title "OVH Nexus ${TAG}" \
              --generate-notes \
              --notes-file "$NOTES_FILE"
          fi
