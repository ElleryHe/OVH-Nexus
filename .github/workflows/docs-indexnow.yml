name: docs-indexnow

on:
  push:
    branches: [ "main" ]
    paths:
      - "website/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  submit-indexnow:
    name: Build Docs & Ping IndexNow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies & build sitemap
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Verify live IndexNow key & submit updated URLs
        working-directory: website
        run: node ./scripts/indexnow.mjs --wait-for-deploy
