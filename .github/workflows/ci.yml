name: ci

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: WebUI Build & Go Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install WebUI dependencies & build SPA
        run: |
          npm ci
          npm run build

      - name: Embed SPA bundle into Go webui package
        run: |
          rm -rf server/internal/webui/dist/*
          cp -r dist/* server/internal/webui/dist/

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: server/go.sum

      - name: Run Go vet & race-enabled unit tests
        working-directory: server
        env:
          API_SECRET_KEY: "ci-test-master-secret-key-at-least-12-chars"
          DATA_ENCRYPTION_KEY: "ci-test-vault-encryption-key-at-least-16-chars"
        run: |
          go vet ./...
          go test -race ./...

      - name: Verify static Go binary build
        working-directory: server
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/ovh-nexus ./cmd/ovh-nexus

  docs-build:
    name: Documentation Site Build (Astro Starlight)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build tri-lingual documentation & Pagefind index
        working-directory: website
        run: npm run build
