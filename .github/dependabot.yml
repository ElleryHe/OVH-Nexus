version: 2
updates:
  # 1. Root WebUI Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      webui-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Lock React 18 ecosystem (prevent partial or breaking React 19 upgrades)
      - dependency-name: "react"
        versions: [">= 19.0.0"]
      - dependency-name: "react-dom"
        versions: [">= 19.0.0"]
      - dependency-name: "@types/react"
        versions: [">= 19.0.0"]
      - dependency-name: "@types/react-dom"
        versions: [">= 19.0.0"]
      # Lock Tailwind CSS v3 & Recharts v2 (prevent breaking v4 / v3 major rewrites)
      - dependency-name: "tailwindcss"
        versions: [">= 4.0.0"]
      - dependency-name: "recharts"
        versions: [">= 3.0.0"]
      # Ignore routine breaking major version jumps across all frontend packages
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # 2. Documentation Portal (npm - Astro Starlight)
  - package-ecosystem: "npm"
    directory: "/website"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps-docs)"
    groups:
      docs-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # 3. Go Backend & Embedded Server (gomod)
  - package-ecosystem: "gomod"
    directory: "/server"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps-go)"
    groups:
      gomod-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # 4. Container Base Images (Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps-docker)"
    ignore:
      # Keep LTS/pinned base images (node:24-alpine, golang:1.27-alpine, alpine:3.24) without bleeding-edge major/minor jumps
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "golang"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "alpine"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # 5. GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
